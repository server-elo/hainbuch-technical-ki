<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HAINBUCH Technical Advisor">
  <defs>
    <clipPath id="slots">
      <!-- full square minus three 10° radial slots at 90/210/330° = collet jaw gaps -->
      <path d="M0 0h64v64H0z
               M32 32 L36.4 -17.8 L27.6 -17.8 Z
               M32 32 L-13.3 53.1 L-9.0 60.7 Z
               M32 32 L73.0 60.7 L77.3 53.1 Z"
            clip-rule="evenodd"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="#d40511"/>

  <!-- segmented clamping ring (three jaws) -->
  <g clip-path="url(#slots)">
    <circle cx="32" cy="32" r="19" fill="none" stroke="#fff" stroke-width="7"/>
  </g>

  <!-- workpiece bore -->
  <circle cx="32" cy="32" r="7.5" fill="#fff"/>
  <circle cx="32" cy="32" r="3.4" fill="#d40511"/>
</svg>
